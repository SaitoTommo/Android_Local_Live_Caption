# Project-wide Gradle settings.
# The project path contains non-ASCII characters and this machine's native encoding is
# GBK. Gradle writes worker @argfiles with the daemon's default charset, while the JDK
# launcher reads them with the native charset; running the daemon as UTF-8 on a GBK
# Windows install makes every test worker lose its classpath (ClassNotFoundException).
# Pin the daemon to the native charset so both sides agree. Sources are still UTF-8.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=GBK
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# This project lives in a path containing non-ASCII characters.
android.overridePathCheck=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
